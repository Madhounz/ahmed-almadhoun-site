backend:
  name: github
  repo: Madhounz/ahmed-almadhoun-site
  branch: main
media_folder: "photos"
public_folder: "/photos"
collections:
  - name: "portfolio"
    label: "Professional Portfolio"
    files:
      - name: "selected-work"
        label: "Selected Work"
        file: "_data/portfolio.json"
        fields:
          - {label: "Last updated", name: "updated", widget: "string"}
          - label: "Research outputs"
            name: "works"
            widget: "list"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Status", name: "status", widget: "select", options: ["Published", "Accepted", "Presented", "Submitted"]}
              - {label: "Type", name: "type", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Venue", name: "venue", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Publication URL", name: "url", widget: "string", required: false}
